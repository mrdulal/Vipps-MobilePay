name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: [8.1, 8.2, 8.3]
        laravel: [9.*, 10.*, 11.*, 12.*]
        include:
          - laravel: 9.*
            testbench: 7.*
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
        exclude:
          - laravel: 11.*
            php: 8.1
          - laravel: 12.*
            php: 8.1

    name: Test P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, openssl, json

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

  release:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: json, openssl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-dev

      - name: Get the version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🎉 Laravel MobilePay Vipps Package ${{ steps.get_version.outputs.VERSION }}
            
            ### 🚀 Features
            - **Complete MobilePay Vipps Integration** for Laravel 9-12
            - **Multiple Payment Methods**: ePayment, Checkout, Express, Recurring
            - **Event-Driven Architecture**: Laravel events for all payment actions
            - **Secure Webhook Support**: With signature verification
            - **Developer-Friendly**: Full type hints and comprehensive documentation
            
            ### 🌍 Market Coverage
            - **Norway** (Vipps) - 4.2M users
            - **Denmark** (MobilePay) - 4.4M users  
            - **Finland** (MobilePay) - 2.8M users
            
            ### 📋 Requirements
            - PHP 8.1-8.3
            - Laravel 9-12
            - Guzzle HTTP 7.0+
            
            ### 📦 Installation
            ```bash
            composer require mrdulal/laravel-vipps
            ```
            
            ### 📚 Documentation
            See the [README](https://github.com/mrdulal/Vipps-MobilePay/blob/main/README.md) for complete installation and usage instructions.
            
            ---
            **⚠️ Note**: This is an unofficial package developed independently by a solo developer.
          draft: false
          prerelease: false

      - name: Package validation
        run: |
          echo "✅ Package validation completed"
          echo "📦 Package: mrdulal/laravel-vipps"
          echo "🔖 Version: ${{ steps.get_version.outputs.VERSION }}"
          echo "🎯 Ready for Packagist submission"